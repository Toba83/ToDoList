{% extends 'parent/base.html' %}
{% block title %}Task list{% endblock %}
{% block content %}

    <h1>Task List</h1>
    <hr>

    <ol style="--length: {{ tasks | length }}">
        {% for task in tasks %}

            <li style="--i: {{ forloop.counter }}">
                <h3>
                    <a href="{{ task.get_absolute_url }}">{{ task.title }}</a>
                </h3>

                <h5>
                    {{ task.description | truncatewords:3 }} | {{ task.priority }}
                </h5>
            </li>

        {% endfor %}
    </ol>

{% endblock %}
